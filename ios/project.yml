name: DelayedAlert
options:
  bundleIdPrefix: com.delayedalert
  deploymentTarget:
    iOS: "16.0"
targets:
  DelayedAlert:
    type: application
    platform: iOS
    sources:
      - path: DelayedAlert
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.delayedalert.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
    entitlements:
      path: DelayedAlert/DelayedAlert.entitlements
      properties:
        com.apple.developer.usernotifications.communication: true
    info:
      path: DelayedAlert/Info.plist
      properties:
        CFBundleDisplayName: Delayed Alert
        UILaunchScreen: {}
        NSUserActivityTypes: [INSendMessageIntent]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.delayedalert.refresh]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
